modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/bh679/lostcityterrainfit-mc/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/bh679/lostcityterrainfit-mc"

# Big Lost City — required, MINIMUM version. All Rights Reserved, never bundled. Server-side world
# generation; BOTH because single-player runs it on the client. AFTER so its structures and
# pools are registered before ours reference them.
[[dependencies.${mod_id}]]
    modId="big_lost_city"
    type="required"
    versionRange="[${biglostcity_min_version},)"
    ordering="AFTER"
    side="BOTH"

# WWOO — optional; the ground rules were tuned against its terrain, but nothing needs it.
[[dependencies.${mod_id}]]
    modId="wwoo"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
