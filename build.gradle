// Lost City Terrain Fit — Minecraft world-gen compat mod (NeoForge 1.21.1).
//
// Seats Big Lost City's buildings in the world's own terrain (footprint-floor
// seating, a fill-only beard, the world's ground and water running through the
// ruins) and adds configurable all-biome copies of its big buildings.
// Server-side world generation; optional on clients.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    exclude '**/CLAUDE.md'   // authoring docs — never a MC resource
}

repositories {
    mavenCentral()

    // Modrinth — hosts Big Lost City (and WWOO for -Pwwoo dev runs) via its
    // Maven proxy (api.modrinth.com/maven).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Auto-join a world instead of stopping at the title screen:
            //   ./gradlew runClient -PquickPlay="New World"
            // The graphics matrix re-runs the same in-world check under three
            // renderer configurations; clicking through the world-select screen
            // each time makes those runs differ in ways nobody records. A project
            // property rather than an env var because a forked run inherits the
            // Gradle daemon's environment, not the invoking shell's.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

dependencies {
    // Big Lost City — the structure mod this one fits into the ground. All Rights Reserved, so NEVER
    // bundled; neoforge.mods.toml declares it required. No code compiles against it — every reference
    // is by registry id (big_lost_city:*) — but `implementation` puts it on the dev-run and JUnit
    // classpaths as a *mod* so runClient generates real cities.
    implementation "maven.modrinth:big-lost-city:${biglostcity_version}"

    // WWOO — optional. Not needed to build or run; add `-Pwwoo` to see the cities in WWOO's terrain,
    // which is what the ground rules were tuned against.
    if (project.hasProperty('wwoo')) {
        runtimeOnly "maven.modrinth:wwoo:${wwoo_version}"
        runtimeOnly "maven.modrinth:cristel-lib:${cristellib_version}"
    }

    // Unit tests — JUnit 5 Jupiter (pure-logic only).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Generate neoforge.mods.toml + pack.mcmeta from templates.
tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
        biglostcity_min_version : biglostcity_min_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir tasks.named('generateModMetadata')
neoForge.ideSyncTask tasks.named('generateModMetadata')

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors,
        ])
    }
}
