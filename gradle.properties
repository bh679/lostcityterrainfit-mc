# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings — readable parameter names + javadoc.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
# Latest at https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.228
loader_version_range=[1,)

# Mod
mod_id=lostcityterrainfit
mod_name=Lost City Terrain Fit
mod_license=PolyForm Shield 1.0.0
mod_version=0.1.1
mod_group_id=games.brennan.lostcityterrainfit
mod_authors=Brennan Hatton
mod_description=Big Lost City's buildings sit in the world's own terrain instead of on a flat stamped pad: settled to the footprint's floor, the ground drawn up beneath them, hills climbing over the ruins and seas flooding them. Optionally adds the big buildings to every overworld biome. Works great with William Wythers' Overhauled Overworld.

# ─────────────────────────────────────────────────────────────────────────────
# Big Lost City — REQUIRED. https://modrinth.com/mod/big-lost-city
# All Rights Reserved, so NEVER bundled: end users install it; mods.toml declares it.
# biglostcity_version is the Modrinth version id the dev runs use (the same pin as
# Dungeon Train's); biglostcity_min_version is the floor rendered into mods.toml.
# ─────────────────────────────────────────────────────────────────────────────
biglostcity_version=5ciGCJeq
biglostcity_min_version=1.0.1

# WWOO + its library — OPTIONAL, dev runs only (./gradlew runClient -Pwwoo).
wwoo_version=sU7oaRZv
cristellib_version=Sduz0AWP
